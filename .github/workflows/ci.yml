name: CI

# Tiered on purpose. CNA has 14 renderers across five platforms, and a naive
# "every renderer x every platform" matrix would be mostly impossible
# combinations (a GitHub runner cannot build a DirectX renderer on Linux, or
# Metal anywhere but macOS) and would take hours to tell you nothing.
#
#   Tier A  structure   every push — cheap, catches manifest/preset/doc drift
#   Tier B  core        every push — representative renderers, built AND run
#   Tier C  broad       scheduled/manual — wider renderer set, build only
#   Tier D  platforms   every push — web and Android, which need their own SDKs
#
# The renderer lists are NOT written here. They come from cmake/renderers.json
# via tools/gen_renderer_files.py --ci-matrix, so adding a renderer to the
# manifest is enough to put it in CI, and a renderer cannot be listed correctly
# in the manifest and wrongly in this file.

on:
  push:
  pull_request:
  schedule:
    - cron: '0 4 * * 1'   # Monday 04:00 UTC — tier C
  workflow_dispatch:
    inputs:
      broad:
        description: 'Run the broad (tier C) renderer matrix'
        type: boolean
        default: true

permissions:
  contents: read

env:
  # One place to change the validated compatibility baseline. Keep in step with
  # dependencies.lock — the structure job checks that they agree. These are the
  # released tags CNA v0.1.0, sharp-runtime v0.1.0, easy-gl v0.1.1 and meta-gl
  # v0.4.1; CNA 0.1.0 refuses a sibling at another version, and so does the
  # template (cmake/CnaTemplateDependencies.cmake), so they move together.
  CNA_REF: 10a4ef1cb4cd832f761536d77588000104947f8d
  SHARP_RUNTIME_REF: c20373bae5be1f02d1fe2fa33c4cbba8ad05e4a0
  EASY_GL_REF: f4d6afaf16cdc7e7e73130950bc45e6d865b41bd
  META_GL_REF: dd3b30055d55fdc42240de7af248259338256992

jobs:
  # --- Tier A -------------------------------------------------------------
  structure:
    name: Structure and drift
    runs-on: ubuntu-latest
    outputs:
      tier_b: ${{ steps.matrix.outputs.tier_b }}
      tier_c: ${{ steps.matrix.outputs.tier_c }}
    steps:
      - uses: actions/checkout@v4
        with: { path: cna-template }
      - uses: actions/checkout@v4
        with:
          repository: libcna/cna
          ref: ${{ env.CNA_REF }}
          path: cna

      - name: Generated files match the manifest
        working-directory: cna-template
        # Also cross-checks the manifest against CNA's own canonical renderer
        # list, so a renderer added upstream fails here rather than silently
        # going missing from the template.
        run: python3 tools/gen_renderer_files.py --check

      - name: Pinned revisions match dependencies.lock
        working-directory: cna-template
        run: |
          set -eu
          fail=0
          check() {
            want=$(grep "^$1=" dependencies.lock | cut -d= -f2)
            if [ "$want" != "$2" ]; then
              echo "::error::dependencies.lock has $1=$want but the workflow pins $2"
              fail=1
            fi
          }
          check CNA           "$CNA_REF"
          check SHARP_RUNTIME "$SHARP_RUNTIME_REF"
          check EASY_GL       "$EASY_GL_REF"
          check META_GL       "$META_GL_REF"
          exit $fail

      - name: Presets parse
        working-directory: cna-template
        run: cmake --list-presets

      - id: matrix
        name: Build renderer matrices from the manifest
        working-directory: cna-template
        run: |
          echo "tier_b=$(python3 tools/gen_renderer_files.py --ci-matrix linux --tiers B)" >> "$GITHUB_OUTPUT"
          echo "tier_c=$(python3 tools/gen_renderer_files.py --ci-matrix linux --tiers C)" >> "$GITHUB_OUTPUT"

  # --- Tier B -------------------------------------------------------------
  linux-core:
    name: Linux ${{ matrix.renderer }}
    needs: structure
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        renderer: ${{ fromJSON(needs.structure.outputs.tier_b) }}
    steps:
      - uses: actions/checkout@v4
        with: { path: cna-template }
      - uses: actions/checkout@v4
        with: { repository: libcna/cna, ref: '${{ env.CNA_REF }}', path: cna }
      - uses: actions/checkout@v4
        with: { repository: libcna/sharp-runtime, ref: '${{ env.SHARP_RUNTIME_REF }}', path: sharp-runtime }
      - uses: actions/checkout@v4
        with: { repository: libcna/easy-gl, ref: '${{ env.EASY_GL_REF }}', path: easy-gl }
      - uses: actions/checkout@v4
        with: { repository: libcna/meta-gl, ref: '${{ env.META_GL_REF }}', path: meta-gl }

      - name: Install build dependencies
        run: |
          sudo apt-get update
          # X11/Wayland headers: CNA's vendored SDL3 refuses to configure without one of them, and the
          # hosted image no longer ships them (CNA plans/plan_apple_m4.md AM4-249).
          # libcurl + nlohmann-json: CNA's gamer services (GS-003a) need both on desktop builds.
          sudo apt-get install -y ninja-build ccache pkg-config xvfb \
            libcurl4-openssl-dev nlohmann-json3-dev \
            libx11-dev libxext-dev libxrandr-dev libxi-dev libxcursor-dev libxfixes-dev libxss-dev \
            libxtst-dev libwayland-dev wayland-protocols libxkbcommon-dev libudev-dev libdbus-1-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswresample-dev \
            libgl1-mesa-dev libglu1-mesa-dev mesa-utils

      - name: Fetch CNA's vendored submodules
        working-directory: cna
        run: git submodule update --init third_party/SDL third_party/SDL_image third_party/SDL_mixer third_party/draco

      - uses: hendrikmuhs/ccache-action@v1
        with: { key: 'linux-${{ matrix.renderer }}' }

      - name: Configure
        working-directory: cna-template
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCNA_GRAPHICS_RENDERER=${{ matrix.renderer }}

      - name: Build
        working-directory: cna-template
        run: cmake --build build --parallel 3

      # The smoke test carries a CTest label describing what it needs. The four
      # windowless renderers run with no display at all; the rest get Xvfb.
      - name: Smoke test (no display)
        working-directory: cna-template
        run: ctest --test-dir build -L headless --output-on-failure --no-tests=ignore

      - name: Smoke test (virtual display)
        working-directory: cna-template
        run: xvfb-run -a ctest --test-dir build -L display --output-on-failure --no-tests=ignore

  # --- Tier C -------------------------------------------------------------
  linux-broad:
    name: Linux ${{ matrix.renderer }} (build only)
    needs: structure
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        renderer: ${{ fromJSON(needs.structure.outputs.tier_c) }}
    steps:
      - uses: actions/checkout@v4
        with: { path: cna-template }
      - uses: actions/checkout@v4
        with: { repository: libcna/cna, ref: '${{ env.CNA_REF }}', path: cna }
      - uses: actions/checkout@v4
        with: { repository: libcna/sharp-runtime, ref: '${{ env.SHARP_RUNTIME_REF }}', path: sharp-runtime }
      - uses: actions/checkout@v4
        with: { repository: libcna/easy-gl, ref: '${{ env.EASY_GL_REF }}', path: easy-gl }
      - uses: actions/checkout@v4
        with: { repository: libcna/meta-gl, ref: '${{ env.META_GL_REF }}', path: meta-gl }

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache pkg-config \
            libcurl4-openssl-dev nlohmann-json3-dev \
            libx11-dev libxext-dev libxrandr-dev libxi-dev libxcursor-dev libxfixes-dev libxss-dev \
            libxtst-dev libwayland-dev wayland-protocols libxkbcommon-dev libudev-dev libdbus-1-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswresample-dev \
            libgl1-mesa-dev libglu1-mesa-dev libvulkan-dev \
            libgles-dev libshaderc-dev

      - name: Fetch CNA's vendored submodules
        working-directory: cna
        run: git submodule update --init third_party/SDL third_party/SDL_image third_party/SDL_mixer third_party/draco

      - uses: hendrikmuhs/ccache-action@v1
        with: { key: 'linux-broad-${{ matrix.renderer }}' }

      - name: Configure
        working-directory: cna-template
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCNA_GRAPHICS_RENDERER=${{ matrix.renderer }}

      - name: Build
        working-directory: cna-template
        run: cmake --build build --parallel 3

  # --- Tier D: platforms with their own SDKs ------------------------------
  web:
    name: Web (${{ matrix.renderer }})
    needs: structure
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # WEBGL2 is CNA's web default. CANVAS, the WebGL-free DOM path this matrix
        # also built, was retired by CNA (RRC-018) and is gone from the manifest
        # (CNA plans/plan_apple_m4.md AM4-291).
        renderer: [WEBGL2]
    steps:
      - uses: actions/checkout@v4
        with: { path: cna-template }
      - uses: actions/checkout@v4
        with: { repository: libcna/cna, ref: '${{ env.CNA_REF }}', path: cna }
      - uses: actions/checkout@v4
        with: { repository: libcna/sharp-runtime, ref: '${{ env.SHARP_RUNTIME_REF }}', path: sharp-runtime }
      - uses: actions/checkout@v4
        with: { repository: libcna/easy-gl, ref: '${{ env.EASY_GL_REF }}', path: easy-gl }
      - uses: actions/checkout@v4
        with: { repository: libcna/meta-gl, ref: '${{ env.META_GL_REF }}', path: meta-gl }

      - uses: mymindstorm/setup-emsdk@v14
        with: { version: 6.0.3 }

      # CNA's gamer services read the host's header-only nlohmann-json even in a cross build
      # (CNA cmake/HeaderOnlyJson.cmake); the web build links no libcurl.
      - name: Install host JSON headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nlohmann-json3-dev

      - name: Fetch CNA's vendored submodules
        working-directory: cna
        run: git submodule update --init third_party/SDL third_party/SDL_image third_party/SDL_mixer third_party/draco

      - name: Configure
        working-directory: cna-template
        run: emcmake cmake -S . -B build-web -DCMAKE_BUILD_TYPE=Release -DCNA_GRAPHICS_RENDERER=${{ matrix.renderer }}

      - name: Build
        working-directory: cna-template
        run: cmake --build build-web --parallel 3

      - name: Check the web artifacts exist
        working-directory: cna-template
        run: |
          set -eu
          for f in HelloGame.html HelloGame.js HelloGame.wasm HelloGame.data; do
            test -f "build-web/$f" || { echo "::error::missing build-web/$f"; exit 1; }
          done
          ls -la build-web/HelloGame.*

      - uses: actions/upload-artifact@v4
        with:
          name: web-${{ matrix.renderer }}
          path: cna-template/build-web/HelloGame.*

  windows:
    name: Windows (MSVC, SDL_RENDERER)
    # windows-2022, not windows-latest: windows-latest moved to Visual Studio 2026, where the
    # "Visual Studio 17 2022" generator this job and the README use finds no instance (CNA
    # plans/plan_apple_m4.md AM4-250).
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with: { path: cna-template }
      - uses: actions/checkout@v4
        with: { repository: libcna/cna, ref: '${{ env.CNA_REF }}', path: cna }
      - uses: actions/checkout@v4
        with: { repository: libcna/sharp-runtime, ref: '${{ env.SHARP_RUNTIME_REF }}', path: sharp-runtime }

      - name: Fetch CNA's vendored submodules
        working-directory: cna
        run: git submodule update --init third_party/SDL third_party/SDL_image third_party/SDL_mixer third_party/draco

      # CNA's gamer services (GS-003a) need libcurl and nlohmann-json on desktop builds. The image's
      # own vcpkg provides both for MSVC; its toolchain file points find_package() at them.
      - name: Install libcurl and nlohmann-json (vcpkg)
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install curl nlohmann-json --triplet x64-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Configure
        working-directory: cna-template
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCNA_GRAPHICS_RENDERER=SDL_RENDERER "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build
        working-directory: cna-template
        run: cmake --build build --config Debug --parallel 3

  android:
    name: Android (Gradle)
    runs-on: ubuntu-latest
    # Not gating pull requests on it: CNA's own documentation currently
    # disagrees with itself about whether the NDK cross-build works, so a
    # failure here is more likely to be upstream than to be this template.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with: { path: cna-template }
      - uses: actions/checkout@v4
        with: { repository: libcna/cna, ref: '${{ env.CNA_REF }}', path: cna }
      - uses: actions/checkout@v4
        with: { repository: libcna/sharp-runtime, ref: '${{ env.SHARP_RUNTIME_REF }}', path: sharp-runtime }

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      # v4: v3 asks sdkmanager for the removed `tools` package and rejects the image's newer
      # cmdline-tools, and failed accepting licenses on every run (fixed upstream in v4.0.2;
      # CNA plans/plan_apple_m4.md AM4-251).
      - uses: android-actions/setup-android@v4

      - name: Fetch CNA's vendored submodules
        working-directory: cna
        run: git submodule update --init third_party/SDL third_party/SDL_image third_party/SDL_mixer third_party/draco

      # CNA's gamer services read the host's header-only nlohmann-json in the NDK cross build too
      # (CNA cmake/HeaderOnlyJson.cmake); libcurl is optional there and absent from the NDK.
      - name: Install host JSON headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nlohmann-json3-dev

      - name: Assemble debug APK
        working-directory: cna-template/android
        run: ./gradlew --no-daemon assembleDebug -PcnaRootDir="${GITHUB_WORKSPACE}/cna"
