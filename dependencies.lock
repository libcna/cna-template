# Compatibility baseline for cna-template.
#
# Compatibility baseline: the CNA apple/m4-stabilization line (CNA plans/plan_apple_m4.md
# AM4-291 and later), merged into next on 2026-10-10. docs/renderer-build-report.md
# records the earlier 2026-09-28 matrix against CNA d5cf852, an ancestor of this pin.
# CI pins these (.github/workflows/ci.yml); its "structure" job fails if the two ever
# disagree.
#
# You are not required to use these: the template consumes sibling checkouts, so
# an application can deliberately track newer revisions. They exist so that a
# build failure can be attributed — if it reproduces at these SHAs it is the
# template's problem, and if it does not, it arrived with an upstream change.
#
# Which of these you actually need depends on the renderer you select:
#   CNA, SHARP_RUNTIME   always
#   EASY_GL, META_GL     the three GL renderers (OPENGLES3/OPENGL33/WEBGL2)
# See docs/renderers.md for the full per-renderer dependency column.
#
# When updating: change these, change the env: block in ci.yml, and re-run the
# host verification matrix recorded in NEXT.md.

CNA=10a4ef1cb4cd832f761536d77588000104947f8d
SHARP_RUNTIME=c20373bae5be1f02d1fe2fa33c4cbba8ad05e4a0
